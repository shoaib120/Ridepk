<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — RidePK</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">
  <div class="auth-wrap">
    <a href="index.html" class="logo" style="display:block;text-align:center;margin-bottom:24px">🚗 Ride<span>PK</span></a>

    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="auth-sub">Sign up as a passenger to book rides.</p>

      <form id="registerForm" onsubmit="doRegister(event)">
        <div class="two-col">
          <div class="fgroup">
            <label>Full Name *</label>
            <input type="text" id="name" placeholder="Your name" required />
          </div>
          <div class="fgroup">
            <label>Phone Number *</label>
            <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required />
          </div>
        </div>
        <div class="fgroup">
          <label>Email (optional)</label>
          <input type="email" id="email" placeholder="your@email.com" />
        </div>
        <div class="fgroup">
          <label>Password *</label>
          <input type="password" id="password" placeholder="Create a strong password" required />
        </div>
        <div class="fgroup">
          <label>Confirm Password *</label>
          <input type="password" id="confirm" placeholder="Repeat password" required />
        </div>
        <div class="fgroup">
          <label>
            <input type="checkbox" id="terms" required />
            I agree to the <a href="#" class="link">Terms & Conditions</a>
          </label>
        </div>
        <button type="submit" class="btn-confirm" style="width:100%">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html" class="link">Login</a></p>
      <p class="auth-switch">Want to drive? <a href="driver-register.html" class="link">Register as Driver</a></p>
    </div>
  </div>

  <script>
    function doRegister(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) { alert('Passwords do not match!'); return; }

      const data = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        password
      };

      fetch((window.RIDEPK_API_BASE||'https://ridepk.onrender.com')+'/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(res => {
        if (res.token) {
          localStorage.setItem('token', res.token);
          localStorage.setItem('role', 'passenger');
          window.location.href = 'booking.html';
        } else {
          alert(res.message || 'Registration failed');
        }
      })
      .catch(() => {
        alert('Demo mode: Backend not running yet (Step 2). Account saved locally for now.');
        localStorage.setItem('demo_user', JSON.stringify(data));
        window.location.href = 'booking.html';
      });
    }
  </script>
</body>
</html>
