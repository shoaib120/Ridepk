<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — RidePK</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 6px;
      text-align: center;
    }
    .logo span { color: #ff6b00; }
    .logo-sub {
      color: #888;
      font-size: 0.82rem;
      text-align: center;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a45;
      border-radius: 16px;
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; }
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 0.83rem;
      color: #888;
      margin-bottom: 26px;
    }

    /* ── Invalid token state ── */
    #invalid-wrap {
      display: none;
      text-align: center;
      padding: 8px 0;
    }
    #invalid-wrap .invalid-icon {
      font-size: 2.5rem;
      margin-bottom: 14px;
    }
    #invalid-wrap .invalid-title {
      color: #f87171;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    #invalid-wrap .invalid-msg {
      color: #888;
      font-size: 0.85rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    #invalid-wrap a {
      color: #ff6b00;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }
    #invalid-wrap a:hover { text-decoration: underline; }

    /* ── Fields ── */
    .field { margin-bottom: 18px; }
    label {
      display: block;
      color: #bbb;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      background: #0f0f1a;
      border: 1.5px solid #2a2a45;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus,
    input[type="text"]:focus { border-color: #ff6b00; }
    input::placeholder { color: #444; }

    /* ── Password eye toggle ── */
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 44px; }
    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: #666;
      padding: 0;
      line-height: 1;
    }
    .eye-btn:hover { color: #aaa; }

    /* ── Requirements hint ── */
    .pw-hint {
      font-size: 0.78rem;
      color: #555;
      margin-top: 6px;
    }

    /* ── Message ── */
    #msg-box {
      display: none;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 0.85rem;
      line-height: 1.5;
      font-weight: 600;
    }
    #msg-box.error {
      background: #2d0e0e;
      border: 1px solid #c0392b;
      color: #ff6b6b;
    }
    #msg-box.success {
      background: #0a2014;
      border: 1px solid #22c55e44;
      color: #22c55e;
    }

    /* ── Submit ── */
    .btn-submit {
      width: 100%;
      background: #ff6b00;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 4px;
    }
    .btn-submit:hover:not(:disabled) { background: #e05a00; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-links {
      margin-top: 22px;
      text-align: center;
      font-size: 0.82rem;
      color: #666;
    }
    .footer-links a {
      color: #ff6b00;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-links a:hover { text-decoration: underline; }
    .footer-links .sep { margin: 0 8px; color: #333; }
  </style>
</head>
<body>

  <div class="logo">🚗 Ride<span>PK</span></div>
  <div class="logo-sub">Mirpur AJK — Pakistan</div>

  <div class="card">
    <div class="card-title">Set New Password</div>
    <div class="card-sub">Choose a strong password for your account</div>

    <!-- Invalid / expired token state -->
    <div id="invalid-wrap">
      <div class="invalid-icon">🔗</div>
      <div class="invalid-title">Invalid or Expired Link</div>
      <div class="invalid-msg">
        This password reset link is invalid or has expired.<br>
        Please request a new one from the login page.
      </div>
      <a href="login.html">← Back to Login</a>
    </div>

    <!-- Reset form -->
    <div id="form-wrap">
      <div id="msg-box"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-password">New Password</label>
          <div class="pwd-wrap">
            <input type="password" id="new-password" name="new-password"
                   placeholder="Enter new password" required />
            <button type="button" class="eye-btn" id="eye-new"
                    onclick="togglePwd('new-password','eye-new')" aria-label="Toggle password visibility">👁</button>
          </div>
          <div class="pw-hint">Minimum 6 characters</div>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="pwd-wrap">
            <input type="password" id="confirm-password" name="confirm-password"
                   placeholder="Re-enter new password" required />
            <button type="button" class="eye-btn" id="eye-confirm"
                    onclick="togglePwd('confirm-password','eye-confirm')" aria-label="Toggle confirm password visibility">👁</button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="reset-btn">
          Reset Password
        </button>
      </form>

      <div class="footer-links">
        <a href="login.html">← Back to Login</a>
        <span class="sep">·</span>
        <a href="index.html">Home</a>
      </div>
    </div>
  </div>

  <script>
    function togglePwd(inputId, btnId) {
      var inp = document.getElementById(inputId);
      var btn = document.getElementById(btnId);
      if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
      else { inp.type = 'password'; btn.textContent = '👁'; }
    }

    function showMsg(msg, isError) {
      var el = document.getElementById('msg-box');
      el.textContent = msg;
      el.className = isError ? 'error' : 'success';
      el.style.display = 'block';
    }

    window.addEventListener('load', function() {
      var params = new URLSearchParams(window.location.search);
      var resetToken = params.get('token');

      if (!resetToken) {
        document.getElementById('form-wrap').style.display = 'none';
        document.getElementById('invalid-wrap').style.display = 'block';
        return;
      }

      document.getElementById('reset-form').addEventListener('submit', function(e) {
        e.preventDefault();

        var pw  = document.getElementById('new-password').value;
        var pw2 = document.getElementById('confirm-password').value;

        if (pw.length < 6) { showMsg('Password must be at least 6 characters.', true); return; }
        if (pw !== pw2)    { showMsg('Passwords do not match.', true); return; }

        var btn = document.getElementById('reset-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>Resetting...';

        fetch('https://ridepk.onrender.com/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, password: pw })
        }).then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.success) {
            showMsg('✅ Password reset successfully! Redirecting...', false);
            setTimeout(function() { window.location.href = 'login.html'; }, 2000);
          } else {
            btn.disabled = false;
            btn.textContent = 'Reset Password';
            showMsg('❌ ' + (data.message || 'Reset failed. Link may have expired.'), true);
          }
        }).catch(function() {
          btn.disabled = false;
          btn.textContent = 'Reset Password';
          showMsg('❌ Cannot connect to server.', true);
        });
      });
    });
  </script>
</body>
</html>
